name: MIG-2 Budtender Git History Preservation
on:
  push:
    paths: ['.github/workflows/mig-2-history.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve authentic commit authorship on scoped history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet git-filter-repo
          git clone https://github.com/abvhiael/420-integrated-v0.1.git /tmp/budtender-history
          git -C /tmp/budtender-history filter-repo --force \
            --path assets/budtender/ \
            --path clients/budtender-access-v1/ \
            --path clients/budtender-web-v1/ \
            --path src/budtender/ \
            --path docs/budtender/ \
            --path scripts/budtender/
          test "$(git -C /tmp/budtender-history rev-list --count HEAD)" -ge 1
          git -C /tmp/budtender-history remote add destination "https://x-access-token:${GH_TOKEN}@github.com/abvhiael/420-budtender.git"
          git -C /tmp/budtender-history push destination HEAD:refs/heads/migration/filtered-genesis-history
