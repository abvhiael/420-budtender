name: MIG-2 Budtender Inventory Completion
on:
  push:
    paths: ['.github/workflows/mig-2-complete-inventory.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import omitted original files and provenance
        run: |
          git clone https://github.com/abvhiael/420-integrated-v0.1.git /tmp/genesis
          mkdir -p docs/migration
          cp -a /tmp/genesis/docs/budtender docs/
          git -C /tmp/genesis log --date=iso --pretty=format:'%H %ad %an %s' -- assets/budtender clients/budtender-web-v1 clients/budtender-access-v1 src/budtender docs/budtender > docs/migration/budtender-upstream-commit-history.txt
          git add docs/budtender docs/migration
      - name: Commit exact upstream copies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || (git commit -m 'MIG-2: include canonical documentation and source provenance' && git pull --rebase origin main && git push)
