name: MIG-2 Budtender Source Import
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mig-2-import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve pinned public Genesis source
        run: |
          git clone --depth 1 https://github.com/abvhiael/420-integrated-v0.1.git /tmp/genesis
          test -d /tmp/genesis/assets/budtender
      - name: Transfer originals without lossy conversion
        run: |
          mkdir -p assets
          cp -a /tmp/genesis/assets/budtender assets/
          printf '%s\n' "Upstream commit: $(git -C /tmp/genesis rev-parse HEAD)" > MIG-2-UPSTREAM.txt
          find assets/budtender -type f | wc -l
          test "$(find assets/budtender -type f | wc -l)" -ge 600
          for file in $(find assets/budtender -name '*.png' | head -n 2); do file "$file"; done
      - name: Record imported assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/budtender MIG-2-UPSTREAM.txt
          git diff --cached --quiet || (git commit -m 'MIG-2: import original Budtender art and manifests' && git push)
