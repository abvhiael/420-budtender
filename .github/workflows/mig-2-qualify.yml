name: MIG-2 Budtender Source and Level 1
on:
  push:
    paths: ['.github/workflows/mig-2-qualify.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-and-level1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import source and evidence
        run: |
          git clone --depth 1 https://github.com/abvhiael/420-integrated-v0.1.git /tmp/genesis
          mkdir -p clients scripts src packages
          cp -a /tmp/genesis/clients/budtender-web-v1 clients/
          cp -a /tmp/genesis/clients/budtender-access-v1 clients/
          cp -a /tmp/genesis/scripts/budtender scripts/
          cp -a /tmp/genesis/src/budtender src/
          cp -a /tmp/genesis/packages/420-gaming-sdk packages/
          printf 'Genesis source SHA: %s\n' "$(git -C /tmp/genesis rev-parse HEAD)" >> MIG-2-UPSTREAM.txt
      - name: Qualify independent web package
        working-directory: clients/budtender-web-v1
        run: |
          npm run check
          npm test
          npm run security
          npm run ops
      - name: Publish passing scope
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients scripts src packages MIG-2-UPSTREAM.txt
          git diff --cached --quiet || (git commit -m 'MIG-2 Budtender: source and independent Level 1' && git push)
